spring:
  application:
    name: factory3d
  datasource:
    url: ${F3D_DB_URL:jdbc:postgresql://localhost:5433/factory3d}
    username: ${F3D_DB_USER:factory3d}
    password: ${F3D_DB_PASSWORD:factory3d}
  servlet:
    multipart:
      max-file-size: ${F3D_MAX_UPLOAD:200MB}
      max-request-size: ${F3D_MAX_UPLOAD:200MB}
  mvc:
    problemdetails:
      enabled: true
  session:
    timeout: 8h
    jdbc:
      initialize-schema: never # 표는 Flyway V1 이 만듦
server:
  port: ${F3D_PORT:8080}
  error:
    whitelabel:
      enabled: false
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
factory3d:
  # 업로드 파일 (도면 원본·3D 모델·썸네일). DB 에는 이 폴더 기준 상대 경로만
  data-dir: ${F3D_DATA_DIR:../data}
  time-zone: ${F3D_TIME_ZONE:Asia/Seoul}
  # 처음 관리자(admin) 비밀번호. 비우면 임의로 만들어 로그에 한 번 출력 (첫 로그인 때 변경 강제)
  admin-password: ${F3D_ADMIN_PASSWORD:}
  drawing:
    max-source-bytes: ${F3D_DRAWING_MAX_SOURCE:52428800} # 원본 DXF 50MB
    max-plan-bytes: ${F3D_DRAWING_MAX_PLAN:20971520}     # 해석 결과 20MB
  model:
    max-bytes: ${F3D_MODEL_MAX:104857600}        # glb 100MB
    max-thumbnail-bytes: ${F3D_MODEL_THUMB_MAX:2097152}
  live:
    enabled: ${F3D_LIVE_ENABLED:true}          # 가상 MES 1초 진행 (테스트는 끔 — advance 를 직접 부름)
    time-scale: ${F3D_LIVE_TIME_SCALE:1}       # 진행 속도 배율 (1 = 실제 시간, 화면 확인은 30)
    allowed-origins: ${F3D_LIVE_ORIGINS:http://localhost:5200} # 같은 출처는 항상 허용, 개발 서버(vite) 추가
