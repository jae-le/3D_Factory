plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kopens'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    // Claude API 공식 Java SDK (안에서 Jackson 2 를 씀 — 우리 코드는 Jackson 3, SDK 타입은 ai/AnthropicGateway 안에서만)
    implementation 'com.anthropic:anthropic-java:3.8.0'
    runtimeOnly 'org.postgresql:postgresql'
    // 내장 PostgreSQL 17 (프로필 embedded — DB 설치 없이 실행). 운영·기본 실행에는 쓰지 않음
    implementation 'io.zonky.test:embedded-postgres:2.2.2'
    implementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.7.0')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('test') { useJUnitPlatform() }

// 화면(web) 빌드 결과를 jar 의 static/ 에 넣음. 이미 빌드했으면 -PskipWebBuild
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
tasks.register('buildWeb', Exec) {
    description = '화면(web) 빌드 → ../web/dist'
    workingDir file('../web')
    commandLine isWindows ? ['cmd', '/c', 'npm', 'run', 'build'] : ['npm', 'run', 'build']
    inputs.dir('../web/src')
    inputs.file('../web/index.html')
    inputs.file('../web/package.json')
    outputs.dir('../web/dist')
}

tasks.named('bootJar') {
    archiveFileName = 'factory3d.jar'
    if (!project.hasProperty('skipWebBuild')) dependsOn 'buildWeb'
    from('../web/dist') { into 'BOOT-INF/classes/static' }
}

tasks.named('jar') { enabled = false }
